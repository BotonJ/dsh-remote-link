<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<!-- Allow user scaling: many users want to pinch-zoom on mobile. Base font is
     sized for comfortable mobile reading (~16px). -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=3.0, user-scalable=yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#1a1a1a" />
<title>MiMoCode Mobile</title>
<style>
  :root {
    --bg: #1a1a1a;
    --bg-panel: #222222;
    --bg-elev: #2a2a2a;
    --bg-input: #1f1f1f;
    --border: #3a3a3a;
    --text: #e0e0e0;
    --text-dim: #888;
    --text-faint: #666;
    --accent: #4a9eff;
    --accent-dim: #2a6ebb;
    --user: #2a4a6a;
    --asst: #2e2e2e;
    --tool: #3a3a1a;
    --err: #6a2a2a;
    --ok: #2a6a3a;
    --warn: #6a6a2a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    /* 16px is the mobile-friendly default; iOS Safari won't auto-zoom input
       fields when their font-size is >= 16px. */
    font-size: 16px;
    line-height: 1.55;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }
  button { font-family: inherit; font-size: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea { font-family: inherit; font-size: inherit; }

  /* App layout */
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  /* Header */
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header .title { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .session-info { color: var(--text-dim); font-size: 12px; }
  header button.icon-btn {
    padding: 8px 12px;
    border-radius: 6px;
    color: var(--text-dim);
    font-size: 18px;
    transition: background .15s, color .15s;
  }
  header button.icon-btn:hover, header button.icon-btn:active { background: var(--bg-elev); color: var(--text); }
  header button.danger:active { color: #ff6b6b; }

  /* Main split */
  .main { flex: 1; display: flex; min-height: 0; position: relative; }

  /* Sidebar */
  aside {
    width: 240px;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
    transition: transform .25s ease;
  }
  aside .aside-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  aside .aside-header span { flex: 1; color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  aside .aside-header button {
    padding: 4px 10px;
    background: var(--accent);
    color: #fff;
    border-radius: 4px;
    font-size: 12px;
  }
  aside .aside-header button:active { background: var(--accent-dim); }
  #session-list {
    flex: 1; overflow-y: auto; padding: 4px 0;
  }
  .session-item {
    padding: 10px 12px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background .15s;
  }
  .session-item:hover { background: var(--bg-elev); }
  .session-item.active { background: var(--bg-elev); border-left-color: var(--accent); }
  .session-item .s-title { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-item .s-meta { font-size: 12px; color: var(--text-faint); margin-top: 2px; }

  /* Chat area */
  main {
    flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0;
    background: var(--bg);
  }
  #messages {
    flex: 1; overflow-y: auto; padding: 12px;
    -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    padding: 8px 12px;
    border-radius: 10px;
    max-width: 90%;
    word-wrap: break-word; overflow-wrap: break-word; word-break: break-word;
    white-space: pre-wrap;
    animation: fade-in .2s ease;
  }
  @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .msg.user { background: var(--user); align-self: flex-end; border-bottom-right-radius: 2px; }
  .msg.asst { background: var(--asst); align-self: flex-start; border-bottom-left-radius: 2px; }
  .msg .role { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  .msg .text { font-size: 16px; }
  .msg .text .cursor { display: inline-block; width: 6px; background: var(--accent); animation: blink 1s steps(2) infinite; margin-left: 1px; }
  @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }

  .tool-line {
    align-self: flex-start;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 11px;
    font-size: 14px;
    color: var(--text-dim);
    display: flex; align-items: center; gap: 6px;
    max-width: 90%;
  }
  .tool-line .icon { font-size: 15px; }
  .tool-line .name { color: var(--text); font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .tool-line .status { font-size: 12px; }
  .tool-line .status.pending { color: var(--text-faint); }
  .tool-line .status.running { color: var(--warn); }
  .tool-line .status.completed { color: var(--ok); }
  .tool-line .status.error { color: #ff6b6b; }
  .tool-line .title-text { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool-line .spinner {
    width: 10px; height: 10px; border: 1.5px solid var(--text-faint);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--text-faint); text-align: center; padding: 20px;
    flex-direction: column; gap: 10px;
  }
  .empty .big { font-size: 32px; }

  /* Composer */
  .composer {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 10px 12px;
    background: var(--bg-panel);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }
  .composer textarea {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    resize: none;
    max-height: 140px;
    min-height: 40px;
    font-size: 16px; /* iOS won't auto-zoom when >= 16px */
    line-height: 1.4;
    outline: none;
    transition: border-color .15s;
  }
  .composer textarea:focus { border-color: var(--accent); }
  .composer button {
    padding: 10px 16px;
    background: var(--accent);
    color: #fff;
    border-radius: 8px;
    font-weight: 500;
    font-size: 15px;
    min-height: 40px;
    transition: background .15s, opacity .15s;
  }
  .composer button:active { background: var(--accent-dim); }
  .composer button:disabled { opacity: .5; cursor: not-allowed; }
  .composer button.danger { background: var(--err); }

  /* Connection status badge */
  .conn-badge {
    font-size: 11px; padding: 2px 6px; border-radius: 4px;
    background: var(--ok); color: #fff;
  }
  .conn-badge.disconnected { background: var(--err); }
  .conn-badge.connecting { background: var(--warn); }

  /* Mobile responsive */
  .menu-toggle { display: none; }
  @media (max-width: 720px) {
    .menu-toggle { display: inline-block; }
    aside {
      position: absolute; top: 0; left: 0; bottom: 0; z-index: 20;
      width: 80%; max-width: 320px;
      transform: translateX(-100%);
      box-shadow: 4px 0 20px rgba(0,0,0,.5);
    }
    aside.open { transform: translateX(0); }
    .backdrop {
      display: none; position: absolute; inset: 0; background: rgba(0,0,0,.5); z-index: 15;
    }
    .backdrop.show { display: block; }
    .msg { max-width: 95%; }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: var(--bg-elev); color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 6px;
    font-size: 13px; z-index: 100;
    opacity: 0; transition: opacity .3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="icon-btn menu-toggle" id="btn-menu" title="会话列表">☰</button>
    <div class="title" id="header-title">MiMoCode</div>
    <span class="conn-badge connecting" id="conn-badge">连接中</span>
    <button class="icon-btn" id="btn-refresh" title="刷新会话">↻</button>
    <button class="icon-btn danger" id="btn-abort" title="中止" disabled>⏹</button>
  </header>

  <div class="main">
    <div class="backdrop" id="backdrop"></div>
    <aside id="sidebar">
      <div class="aside-header">
        <span>会话</span>
        <button id="btn-new">+ 新建</button>
      </div>
      <div id="session-list"></div>
    </aside>
    <main>
      <div id="messages">
        <div class="empty" id="empty-state">
          <div class="big">💬</div>
          <div>选择左侧会话,或点击「+ 新建」开始</div>
        </div>
      </div>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" disabled></textarea>
        <button id="btn-send" disabled>发送</button>
      </div>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

// ============================================================================
// Configuration & auth
// ============================================================================
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const AUTH_HEADERS = TOKEN
  ? { Authorization: "Basic " + btoa("mimocode:" + TOKEN) }
  : {};

// Append the token to an API path as a query parameter. Handles the case where
// the path already contains a query string (e.g. "/session?foo=bar") by using
// "&" instead of "?". Returns the merged URL.
function withToken(path) {
  if (!TOKEN) return path;
  const sep = path.includes("?") ? "&" : "?";
  return path + sep + "token=" + encodeURIComponent(TOKEN);
}

// State
let currentSessionId = null;
let currentEventSource = null;
let sessions = [];
// The server's working directory. Sessions from other directories are visible
// in /session but their messages cannot be read (404), so we filter them out.
// Discovered lazily by creating a probe session if needed.
let serverDirectory = null;
// messageCache: messageId -> { info, parts: [], rendered: Element|null, textPartEls: Map<partID, Element> }
let messageCache = new Map();
let isStreaming = false;

// ============================================================================
// DOM helpers
// ============================================================================
const $ = (id) => document.getElementById(id);
const messagesEl = $("messages");
const sessionListEl = $("session-list");
const inputEl = $("input");
const sendBtn = $("btn-send");
const abortBtn = $("btn-abort");
const refreshBtn = $("btn-refresh");
const newBtn = $("btn-new");
const menuBtn = $("btn-menu");
const sidebar = $("sidebar");
const backdrop = $("backdrop");
const connBadge = $("conn-badge");
const headerTitle = $("header-title");
const toastEl = $("toast");

function toast(msg, ms = 2000) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove("show"), ms);
}

function fmtTime(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return d.toTimeString().slice(0, 5);
  return (d.getMonth() + 1) + "/" + d.getDate() + " " + d.toTimeString().slice(0, 5);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

// ============================================================================
// API helpers
// ============================================================================
async function apiGet(path) {
  const r = await fetch(withToken(path), { headers: AUTH_HEADERS });
  if (!r.ok) {
    // Surface the server's error body (e.g. NotFoundError: Session not found)
    // so the caller can show a useful message instead of just the status code.
    let detail = "";
    try {
      const ct = r.headers.get("content-type") || "";
      if (ct.includes("application/json")) {
        const j = await r.json();
        detail = j?.data?.message || j?.message || j?.error || JSON.stringify(j);
      } else {
        detail = (await r.text()).slice(0, 200);
      }
    } catch (_) {}
    const err = new Error(`GET ${path} -> ${r.status}${detail ? ": " + detail : ""}`);
    err.status = r.status;
    throw err;
  }
  return r.json();
}
async function apiPost(path, body) {
  const r = await fetch(withToken(path), {
    method: "POST",
    headers: { "Content-Type": "application/json", ...AUTH_HEADERS },
    body: JSON.stringify(body || {}),
  });
  if (!r.ok && r.status !== 204) {
    const text = await r.text().catch(() => "");
    throw new Error(`POST ${path} -> ${r.status}: ${text}`);
  }
  // 204 no content
  if (r.status === 204) return null;
  const ct = r.headers.get("content-type") || "";
  if (ct.includes("application/json")) return r.json();
  return null;
}

// ============================================================================
// Sessions list
// ============================================================================
async function loadSessions() {
  try {
    let all = await apiGet("/session");
    if (!Array.isArray(all)) all = [];

    // The server's cwd is not exposed by any API endpoint, but it determines
    // which sessions' messages are actually readable (messages are stored
    // per-directory). To avoid showing sessions that error out when opened,
    // discover the cwd by creating a throwaway probe session, then delete it.
    if (!serverDirectory) {
      try {
        const probe = await apiPost("/session", {});
        if (probe?.directory) serverDirectory = probe.directory;
        // Remove the probe so it doesn't clutter the list.
        if (probe?.id) {
          await fetch(withToken(`/session/${probe.id}`), {
            method: "DELETE",
            headers: AUTH_HEADERS,
          }).catch(() => {});
        }
      } catch (e) {
        console.warn("Probe session failed, cannot determine cwd", e);
      }
    }

    // Filter to the server's cwd if known; otherwise fall back to showing all.
    sessions = serverDirectory
      ? all.filter((s) => s.directory === serverDirectory)
      : all;
    renderSessionList();
  } catch (e) {
    toast("加载会话失败: " + e.message);
    console.error(e);
  }
}

function renderSessionList() {
  sessionListEl.innerHTML = "";
  if (!sessions.length) {
    const empty = document.createElement("div");
    empty.style.cssText = "padding:20px;color:var(--text-faint);text-align:center;font-size:12px;";
    empty.textContent = "暂无会话";
    sessionListEl.appendChild(empty);
    return;
  }
  // Sort by updated desc
  const sorted = [...sessions].sort((a, b) => (b.time?.updated || 0) - (a.time?.updated || 0));
  for (const s of sorted) {
    const item = document.createElement("div");
    item.className = "session-item" + (s.id === currentSessionId ? " active" : "");
    item.dataset.id = s.id;
    const title = s.title || s.id.slice(0, 12);
    const updated = fmtTime(s.time?.updated || s.time?.created);
    item.innerHTML = `<div class="s-title">${escapeHtml(title)}</div><div class="s-meta">${escapeHtml(updated)}</div>`;
    item.onclick = () => selectSession(s.id);
    sessionListEl.appendChild(item);
  }
}

async function createSession() {
  try {
    const s = await apiPost("/session", {});
    // A freshly created session always belongs to the server's cwd; lock it in.
    if (s?.directory && !serverDirectory) {
      serverDirectory = s.directory;
      // Re-filter existing list now that we know the directory.
      sessions = sessions.filter((x) => x.directory === serverDirectory);
    }
    sessions.unshift(s);
    renderSessionList();
    selectSession(s.id);
    closeSidebar();
  } catch (e) {
    toast("创建会话失败: " + e.message);
  }
}

function selectSession(id) {
  if (currentSessionId === id) return;
  currentSessionId = id;
  messageCache.clear();
  messagesEl.innerHTML = "";
  // Mark active in list
  for (const el of sessionListEl.querySelectorAll(".session-item")) {
    el.classList.toggle("active", el.dataset.id === id);
  }
  const s = sessions.find((x) => x.id === id);
  if (s) headerTitle.textContent = s.title || s.id.slice(0, 12);
  inputEl.disabled = false;
  sendBtn.disabled = false;
  closeSidebar();
  loadMessages(id);
  subscribeSSE();
}

// ============================================================================
// Messages: load + render
// ============================================================================
async function loadMessages(sessionId) {
  try {
    const msgs = await apiGet(`/session/${sessionId}/message?limit=100`);
    if (!Array.isArray(msgs)) return;
    if (msgs.length === 0) {
      showEmptyChat("这个会话还没有消息\n发送第一条消息开始对话");
    } else {
      for (const m of msgs) {
        upsertMessage(m);
      }
      scrollToEnd();
    }
  } catch (e) {
    // Common cause: session belongs to a different working directory than the
    // server's, so it exists in storage but is not visible here (HTTP 404).
    console.error("loadMessages failed", e);
    showEmptyChat("无法加载此会话的消息\n" + (e.message || ""), true);
  }
}

function showEmptyChat(text, isError = false) {
  messagesEl.innerHTML = "";
  const empty = document.createElement("div");
  empty.className = "empty";
  empty.style.whiteSpace = "pre-line";
  if (isError) empty.style.color = "#ff8a8a";
  empty.textContent = text;
  messagesEl.appendChild(empty);
}

// upsertMessage: takes { info, parts } and ensures it is rendered.
// Returns the cache entry.
function upsertMessage(msg) {
  if (!msg || !msg.info) return null;
  const id = msg.info.id;
  let entry = messageCache.get(id);
  if (!entry) {
    entry = { info: msg.info, parts: [], rootEl: null, textPartEls: new Map(), cursorEl: null };
    messageCache.set(id, entry);
    entry.rootEl = createMessageRoot(entry);
    // Insert in order: we just append (loadMessages is sorted; live updates arrive after)
    messagesEl.appendChild(entry.rootEl);
  } else {
    entry.info = { ...entry.info, ...msg.info };
    updateMessageHeader(entry);
  }
  if (Array.isArray(msg.parts)) {
    for (const part of msg.parts) {
      upsertPart(entry, part);
    }
  }
  return entry;
}

function createMessageRoot(entry) {
  const role = entry.info.role;
  const wrap = document.createElement("div");
  wrap.className = "msg " + (role === "user" ? "user" : "asst");
  wrap.dataset.id = entry.info.id;

  const roleEl = document.createElement("div");
  roleEl.className = "role";
  roleEl.textContent = role === "user" ? "你" : "AI";
  wrap.appendChild(roleEl);

  const textEl = document.createElement("div");
  textEl.className = "text";
  wrap.appendChild(textEl);
  entry.textContainer = textEl;

  return wrap;
}

function updateMessageHeader(entry) {
  // (no-op for now; title is static)
}

// upsertPart: render or update a single part within a message.
// Minimal rendering: text (concat) + tool (status line). Other part types ignored.
function upsertPart(entry, part) {
  if (!part || !part.type) return;
  const existingIdx = entry.parts.findIndex((p) => p.id === part.id || (p.type === part.type && p.callID === part.callID && part.callID));
  if (existingIdx >= 0) {
    entry.parts[existingIdx] = mergePart(entry.parts[existingIdx], part);
    renderPart(entry, entry.parts[existingIdx]);
  } else {
    entry.parts.push(part);
    renderPart(entry, part);
  }
}

function mergePart(oldP, newP) {
  // For text parts, prefer newP.text if it has content; otherwise keep old (deltas handled separately)
  return { ...oldP, ...newP };
}

function renderPart(entry, part) {
  if (part.type === "text") {
    let el = entry.textPartEls.get(part.id || "text-default");
    if (!el) {
      el = document.createElement("span");
      el.className = "text-span";
      entry.textContainer.appendChild(el);
      entry.textPartEls.set(part.id || "text-default", el);
    }
    el.textContent = part.text || "";
  } else if (part.type === "tool") {
    renderToolLine(entry, part);
  }
  // Other types (reasoning, file, subtask, etc.) intentionally not rendered in MVP.
  scrollToEnd();
}

function renderToolLine(entry, part) {
  const key = "tool-" + (part.callID || part.id);
  let el = entry.toolLineEls?.get(key);
  if (!entry.toolLineEls) entry.toolLineEls = new Map();
  if (!el) {
    el = document.createElement("div");
    el.className = "tool-line";
    entry.rootEl.appendChild(el);
    entry.toolLineEls.set(key, el);
  }
  const state = part.state || {};
  const status = state.status || "pending";
  const icon = { pending: "⏳", running: "🔧", completed: "✅", error: "❌" }[status] || "🔧";
  const statusText = { pending: "等待中", running: "执行中", completed: "完成", error: "失败" }[status] || status;
  const title = state.title || "";
  el.innerHTML = `<span class="icon">${icon}</span>` +
    (status === "running" ? '<span class="spinner"></span>' : "") +
    `<span class="name">${escapeHtml(part.tool || "tool")}</span>` +
    `<span class="status ${status}">${escapeHtml(statusText)}</span>` +
    (title ? `<span class="title-text">${escapeHtml(title)}</span>` : "");
}

// ============================================================================
// SSE: realtime updates
// ============================================================================
function subscribeSSE() {
  if (currentEventSource) {
    try { currentEventSource.close(); } catch (e) {}
    currentEventSource = null;
  }
  // EventSource cannot set headers; token must be in URL (AuthMiddleware supports ?token=).
  try {
    const es = new EventSource(withToken("/event"));
    currentEventSource = es;
    setConnState("connecting");
    es.onopen = () => setConnState("connected");
    es.onerror = () => {
      setConnState("disconnected");
      // EventSource auto-reconnects; just update badge.
    };
    es.onmessage = (ev) => {
      handleSSEEvent(ev.data);
    };
  } catch (e) {
    setConnState("disconnected");
    console.error("SSE subscribe failed", e);
  }
}

function setConnState(state) {
  connBadge.className = "conn-badge " + state;
  connBadge.textContent = state === "connected" ? "已连接" : state === "connecting" ? "连接中" : "已断开";
}

function handleSSEEvent(raw) {
  let payload;
  try { payload = JSON.parse(raw); } catch (e) { return; }
  if (!payload || !payload.type) return;
  const type = payload.type;
  const props = payload.properties || payload;

  switch (type) {
    case "message.updated": {
      // SSE message.updated carries { sessionID, info } — NOT a full message.
      // It only gives us the message info (role, id, error, etc.) with no parts.
      // We upsert the info immediately (creates the bubble), then fetch parts
      // separately. Skip events for other sessions.
      if (!props.info) break;
      if (props.sessionID && props.sessionID !== currentSessionId) break;

      const msgId = props.info.id;
      const role = props.info.role;
      const hasError = !!props.info.error;
      const isCompleted = !!props.info.time?.completed;

      // Upsert with empty parts (creates the bubble if new).
      const entry = upsertMessage({ info: props.info, parts: [] });

      // If the message is finalized (has completed time) or has an error,
      // fetch its parts so we can render text/tool content. While streaming,
      // deltas arrive via message.part.delta and parts via message.part.updated.
      if ((isCompleted || hasError) && role === "assistant") {
        refreshMessageParts(msgId);
        isStreaming = false;
        abortBtn.disabled = true;
      } else if (role === "assistant" && !isCompleted) {
        // Assistant message started; fetch any parts produced so far.
        refreshMessageParts(msgId);
        isStreaming = true;
        abortBtn.disabled = false;
      } else if (role === "user") {
        // User message: parts may arrive slightly later via message.part.updated,
        // but fetch once now to render the optimistic bubble.
        refreshMessageParts(msgId);
      }
      break;
    }
    case "message.part.updated": {
      // { messageID, part } - a single part finalized
      if (props.sessionID && props.sessionID !== currentSessionId) break;
      const entry = messageCache.get(props.messageID);
      if (entry && props.part) {
        upsertPart(entry, props.part);
      } else if (props.messageID && props.sessionID === currentSessionId) {
        // Message not yet in cache; refresh from server
        refreshMessage(props.messageID);
      }
      break;
    }
    case "message.part.delta": {
      // { messageID, partID, field, delta } - streaming text token
      if (props.sessionID && props.sessionID !== currentSessionId) break;
      const entry = messageCache.get(props.messageID);
      if (entry && props.field === "text") {
        let el = entry.textPartEls.get(props.partID || "text-default");
        if (!el) {
          el = document.createElement("span");
          el.className = "text-span";
          entry.textContainer.appendChild(el);
          entry.textPartEls.set(props.partID || "text-default", el);
        }
        el.textContent += props.delta || "";
        scrollToEnd();
        isStreaming = true;
        abortBtn.disabled = false;
      }
      break;
    }
    case "message.part.removed":
    case "message.removed": {
      // Refresh list / remove
      const entry = messageCache.get(props.messageID);
      if (entry && type === "message.removed") {
        entry.rootEl?.remove();
        messageCache.delete(props.messageID);
      }
      break;
    }
    case "session.updated": {
      // Session list might have changed (title, time)
      loadSessions();
      break;
    }
    default:
      // Other event types (heartbeat, etc.) ignored
      break;
  }
}

async function refreshMessage(messageID) {
  if (!currentSessionId) return;
  await refreshMessageParts(messageID);
}

// Fetch a single message by ID and update its parts in the cache.
// Used by the SSE handler when message.updated fires (which carries only the
// info, not the parts).
async function refreshMessageParts(messageID) {
  if (!currentSessionId) return;
  try {
    const m = await apiGet(`/session/${currentSessionId}/message/${messageID}`);
    if (m && m.info) {
      upsertMessage(m);
      scrollToEnd();
    }
  } catch (e) {
    // Fallback: fetch the whole list and find the message.
    try {
      const msgs = await apiGet(`/session/${currentSessionId}/message?limit=100`);
      if (Array.isArray(msgs)) {
        const m = msgs.find((x) => x.info?.id === messageID);
        if (m) upsertMessage(m);
      }
    } catch (e2) {}
  }
}

function scrollToEnd() {
  // Defer to next paint for smoother scroll
  requestAnimationFrame(() => {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  });
}

// ============================================================================
// Send message
// ============================================================================
async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || !currentSessionId) return;
  inputEl.value = "";
  autoResize();
  sendBtn.disabled = true;
  try {
    // Use prompt_async: returns 204 immediately, reply arrives via SSE.
    await apiPost(`/session/${currentSessionId}/prompt_async`, {
      parts: [{ type: "text", text }],
    });
    // Optimistically add a user message (will be reconciled by SSE message.updated)
    // The server will push the real user message via SSE shortly.
  } catch (e) {
    toast("发送失败: " + e.message);
    sendBtn.disabled = false;
  } finally {
    setTimeout(() => { sendBtn.disabled = false; }, 300);
  }
}

// ============================================================================
// Abort
// ============================================================================
async function abortSession() {
  if (!currentSessionId) return;
  try {
    await apiPost(`/session/${currentSessionId}/abort`, {});
    isStreaming = false;
    abortBtn.disabled = true;
    toast("已请求中止");
  } catch (e) {
    toast("中止失败: " + e.message);
  }
}

// ============================================================================
// Composer: auto-resize textarea
// ============================================================================
function autoResize() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
}

inputEl.addEventListener("input", autoResize);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ============================================================================
// Sidebar toggle (mobile)
// ============================================================================
function openSidebar() { sidebar.classList.add("open"); backdrop.classList.add("show"); }
function closeSidebar() { sidebar.classList.remove("open"); backdrop.classList.remove("show"); }
menuBtn.onclick = openSidebar;
backdrop.onclick = closeSidebar;

// ============================================================================
// Button wiring
// ============================================================================
sendBtn.onclick = sendMessage;
abortBtn.onclick = abortSession;
refreshBtn.onclick = () => { loadSessions(); if (currentSessionId) loadMessages(currentSessionId); toast("已刷新"); };
newBtn.onclick = createSession;

// ============================================================================
// Bootstrap
// ============================================================================
(async function init() {
  // Health check
  try {
    const h = await apiGet("/global/health");
    console.log("MiMoCode server:", h);
  } catch (e) {
    toast("无法连接服务器: " + e.message, 5000);
    setConnState("disconnected");
    return;
  }
  await loadSessions();
  // Auto-select most recent session if any
  if (sessions.length) {
    const sorted = [...sessions].sort((a, b) => (b.time?.updated || 0) - (a.time?.updated || 0));
    selectSession(sorted[0].id);
  } else {
    setConnState("connected");
  }
})();
</script>
</body>
</html>
